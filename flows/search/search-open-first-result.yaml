appId: org.wikipedia
name: AI 검색 → 첫 번째 결과 열기 → 같은 제목의 기사 확인
tags:
  - android
  - sanity
  - regression
  - search
---
# 흐름: 홈 → 검색 탭 → "AI" 입력 → 결과 목록 확인 → 첫 결과 제목을 읽어 둠
#       → 첫 결과 탭 → 기사 화면에 같은 제목이 보이는지 확인
#
# 셀렉터 출처 (2026-11-17, 앱 r/50606, 로컬 한국어 에뮬레이터 maestro hierarchy)
#   id: fragment_search_results  결과 목록 영역. 항목은 Compose라 id가 없어 childOf + index로 첫 항목을 찾는다.
#                                 index 0 = 첫 결과의 제목 (예: 로컬 ko "인공지능", 그 아래 "AI에서 넘어옴"은 index 1)
#   id: page_save                기사 하단 '저장' 버튼 → 기사 화면이 열렸다는 기준
#   기사 제목은 WebView 안의 TextView라 id가 없다 → 읽어 둔 제목과 전체 일치(정규식)로 확인
# 검색 결과는 언어(로컬 ko / CI en)와 날짜에 따라 달라지므로 제목을 하드코딩하지 않는다.
#
# fail 확인 방법: 마지막 assertVisible을 ${output.firstResultRegex}X 로 바꿔 실행 → 이 스텝에서 실패해야 한다.

- runFlow: ../subflows/launch-to-home-android.yaml

# 1. "AI" 검색 (입력값 확인, 결과 목록 대기는 subflow 안에서 한다)
- runFlow:
    file: ../subflows/search-android.yaml
    env:
      QUERY: AI

# 2. 첫 결과 제목을 읽어 로그에 남기고, 셀렉터용으로 이스케이프
#    maestro.log: "JsConsole: [firstResult] 원문: …"
- copyTextFrom:
    text: ".+"
    childOf:
      id: "org.wikipedia:id/fragment_search_results"
    index: 0
- runScript:
    file: ../scripts/escape-regex.js
    env:
      TEXT: ${maestro.copiedText}
      NAME: firstResult

# 3. 첫 결과 열기 → 기사 화면 확인
- tapOn:
    text: ".+"
    childOf:
      id: "org.wikipedia:id/fragment_search_results"
    index: 0
- extendedWaitUntil:
    visible:
      id: "org.wikipedia:id/page_save"
    timeout: 15000
- assertVisible: ${output.firstResultRegex}
