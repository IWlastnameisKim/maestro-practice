appId: org.wikipedia
---
# 공통 사전 조건: 앱 실행 → (처음이면) 온보딩 통과 → 메인 홈 도착 확인
#
# 2026-11-17 변경: 온보딩은 "스위트 실행 시 최초 한 번만"
#   - 앱 데이터 초기화는 flow마다 하지 않고, npm 스크립트가 스위트 시작 전에 한 번 한다.
#     (package.json: adb shell pm clear org.wikipedia)
#   - 여기서는 데이터를 유지한 채 앱만 다시 실행한다(launchApp, clearState 없음).
#     → 스위트의 첫 flow: 온보딩이 뜬다 → 통과시킨다
#     → 다음 flow부터: 바로 홈에서 시작한다 (2026-11-17 로컬 확인)
#   - 주의: npm을 거치지 않고 maestro test로 파일을 직접 실행하면 초기화되지 않은 앱 상태로 시작한다.
#
# 원본: samples/subflows/onboarding-android.yaml, launch-clearstate-android.yaml
#       (영어 전용 → 영어/한국어로 수정, 의미 없는 스텝 제거, 홈 도착 확인 추가)
#
# 문구 출처: 설치된 앱(r/50606-r-2026-09-09)의 문자열 리소스 en / ko
#   onboarding_fresh_install_knowledge_title       "All the world's knowledge"   / "세상의 모든 지식"
#   onboarding_fresh_install_knowledge_learn_more  "Learn more about Wikipedia"  / "위키백과에 대해 더 알아보기"
#   nav_item_forward  "Forward" / "앞으로"   (온보딩 1~3페이지의 다음 버튼, accessibilityText)
#   onboarding_skip   "Skip"    / "건너뛰기" (온보딩 마지막 페이지에만 있음 → docs/troubleshooting.md 8번)
#   home              "Home"    / "홈"       (하단 홈 탭 nav_tab_home의 accessibilityText)
# 온보딩 화면은 Compose로 그려져 resource-id가 없다 → 다국어 텍스트로 확인 (docs/ai-review.md 기록)

# 1. 앱 실행 (데이터 유지)
- launchApp

# 2. 온보딩 첫 화면 또는 홈 탭 중 하나가 그려질 때까지 기다린다.
#    바로 아래 when은 그 순간의 화면으로 판단하므로, 화면이 늦게 그려지는 CI에서
#    아직 아무것도 없을 때 판단해 온보딩을 건너뛰지 않게 하려는 대기다.
- extendedWaitUntil:
    visible: "All the world's knowledge|세상의 모든 지식|Home|홈"
    timeout: 15000

# 3. 온보딩 화면이면(= 스위트의 첫 flow) 온보딩 첫 화면을 확인하고 통과한다.
- runFlow:
    when:
      visible: "All the world's knowledge|세상의 모든 지식"
    label: 온보딩 화면이면(스위트 첫 flow) 첫 화면 확인 후 온보딩 통과
    commands:
      - assertVisible: "Learn more about Wikipedia|위키백과에 대해 더 알아보기"
      - tapOn: "Forward|앞으로"
      - tapOn: "Forward|앞으로"
      - tapOn: "Forward|앞으로"
      - tapOn: "Skip|건너뛰기"

# 4. 메인 홈 도착 확인 (피드 문구가 아니라 하단 탭 구조로 확인) — 모든 flow에서 확인
- assertVisible:
    id: "org.wikipedia:id/nav_tab_home"
    selected: true
