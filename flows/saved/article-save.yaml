appId: org.wikipedia
name: AI 검색 첫 결과 기사 저장 → 저장됨 목록 확인 → 저장 해제
tags:
  - android
  - sanity
  - regression
  - saved
---
# 흐름: 홈 → "AI" 검색 → 첫 번째 결과 기사 → 저장
#       → '저장됨' 탭에서 그 기사 확인 → 저장 해제 → 목록에서 사라졌는지 확인
#
# 2026-11-17 변경: 홈 '새로 들어온 소식' 카드에서 기사를 고르던 방식 → 검색으로 변경
#   카드는 날에 따라 없어서 저장 시나리오 전체가 건너뛰어진 채 pass로 나올 수 있었다.
#   홈 화면 UI 확인은 API 응답을 붙인 뒤 별도 flow로 다시 구성한다.
#
# 셀렉터 출처 (앱 r/50606, maestro hierarchy + 앱 문자열 리소스 en/ko로 확인)
#   id: fragment_search_results      검색 결과 영역 (2026-11-17). 항목은 Compose라 childOf + index로 찾는다.
#   customize_toolbar_title          "Customize toolbar"  / "도구 모음 사용자 지정" (2026-11-10)
#   id: page_save                    기사 하단 '저장' 버튼
#   id: nav_tab_reading_lists        하단 '저장됨' 탭
#   id: reading_list_item_remove     길게 누르기 메뉴의 '저장됨에서 제거하기'
# 검색 결과는 언어(로컬 ko / CI en)와 날짜에 따라 달라지므로 제목을 하드코딩하지 않고 copyTextFrom으로 읽어서 사용한다.
# 읽은 제목은 maestro.log에 "JsConsole: [savedTitle] 원문: …"으로 남는다. (CI에서는 artifact의 maestro.log)

- runFlow: ../subflows/launch-to-home-android.yaml

# 1. "AI" 검색 (입력값 확인, 결과 목록 대기는 subflow 안에서 한다)
- runFlow:
    file: ../subflows/search-android.yaml
    env:
      QUERY: AI

# 2. 첫 결과 제목을 읽어 두고 기사로 이동
- copyTextFrom:
    text: ".+"
    childOf:
      id: "org.wikipedia:id/fragment_search_results"
    index: 0
# 제목을 로그에 남기고, 셀렉터용으로 정규식 특수문자를 이스케이프한다.
#   output.savedTitle      원문
#   output.savedTitleRegex 이스케이프한 값 (예: "아바타 (동음이의)" → "아바타 \(동음이의\)")
- runScript:
    file: ../scripts/escape-regex.js
    env:
      TEXT: ${maestro.copiedText}
      NAME: savedTitle
- tapOn:
    text: ".+"
    childOf:
      id: "org.wikipedia:id/fragment_search_results"
    index: 0
- extendedWaitUntil:
    visible:
      id: "org.wikipedia:id/page_save"
    timeout: 15000

# 첫 기사 진입 시 뜨는 '도구 모음 사용자 지정' 툴팁 (뜨지 않을 수도 있음)
- runFlow:
    when:
      visible: "Customize toolbar|도구 모음 사용자 지정"
    label: 도구 모음 툴팁이 떠 있으면 닫기
    commands:
      - tapOn:
          id: "org.wikipedia:id/buttonView"

# 3. 저장
- tapOn:
    id: "org.wikipedia:id/page_save"
# 저장 직후 '모음집에 추가' 바텀시트가 뜬다. back으로 닫는다.
#   touch_outside를 탭하지 않는 이유: touch_outside는 화면 거의 전체 크기라 Maestro가 탭하는
#   가운데 지점이 기기에 따라 시트 안에 떨어진다. (2026-11-10 CI pixel_6: 가운데 y=1232, 시트 시작 y=1138
#   → 시트가 닫히지 않음)
- extendedWaitUntil:
    visible:
      id: "org.wikipedia:id/touch_outside"
    timeout: 5000
- pressKey: back
# 시트가 닫혔는지 확인한다. 닫히지 않으면 다음 back이 시트 닫기에 쓰여 하단 탭까지 돌아오지 못한다.
- extendedWaitUntil:
    notVisible:
      id: "org.wikipedia:id/touch_outside"
    timeout: 5000

# 4. '저장됨' 탭에서 저장한 기사 확인
#    하단 탭으로 가기 위해 앱을 다시 실행한다 (데이터 유지 → 저장한 기사는 남고, 홈 탭에서 시작).
#    back으로 돌아가는 방식은 기사 → 검색 결과 → (키보드 닫기) → 검색 탭까지 back 3번에
#    약 36초가 걸려(2026-11-17 로컬) 바꿨다. 이 케이스는 저장 기능 확인이 목적이라 back 이동은 검증하지 않는다.
- launchApp
- extendedWaitUntil:
    visible:
      id: "org.wikipedia:id/nav_tab_reading_lists"
    timeout: 15000
- tapOn:
    id: "org.wikipedia:id/nav_tab_reading_lists"
- assertVisible:
    id: "org.wikipedia:id/nav_tab_reading_lists"
    selected: true
# 목록 항목은 Compose라 id가 없어 제목 텍스트로 확인한다.
- assertVisible: ${output.savedTitleRegex}

# 5. 정리: 저장 해제 → 목록에서 사라졌는지 확인
- longPressOn: ${output.savedTitleRegex}
- tapOn:
    id: "org.wikipedia:id/reading_list_item_remove"
- assertNotVisible: ${output.savedTitleRegex}
