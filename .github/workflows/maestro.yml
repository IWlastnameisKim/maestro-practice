name: Maestro UI tests

# 실행 시점
#   - PR       → sanity
#   - 수동 실행  → 스위트(sanity / regression)·앱 버전 선택
on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 실행할 스위트
        type: choice
        options: [sanity, regression]
        default: sanity
      app_version:
        description: "ci/app-versions.json의 id (all = enabled 전체)"
        type: string
        default: all

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "2.12.1" # 로컬과 같은 버전으로 고정
  EMULATOR_API_LEVEL: 34 # 로컬은 API 37(arm64). CI 러너는 x86_64라 안정적인 34를 쓴다.

jobs:
  # 1) 사전 검사: 태깅 규칙, YAML 문법 → 실행할 스위트·앱 버전 결정
  prepare:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 태깅 규칙 검사
        run: npm run check:suites

      # flow 하나라도 파싱에 실패하면 스위트 전체가 시작되지 않으므로 먼저 확인한다.
      - name: YAML 문법 검사
        run: |
          find flows -name "*.yaml" ! -name config.yaml -print0 |
            xargs -0 -n1 sh -c 'echo "check $0" && maestro check-syntax "$0"'

      - name: 실행 계획
        id: plan
        env:
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_VERSION: ${{ inputs.app_version }}
        run: |
          # 수동 실행이면 선택한 스위트, PR이면 sanity
          suite="${INPUT_SUITE:-sanity}"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

          node -e '
            const sel = process.env.INPUT_VERSION || "all";
            const all = require("./ci/app-versions.json");
            const v = all.filter(a => a.enabled !== false && (sel === "all" || a.id === sel));
            if (!v.length) { console.error(`앱 버전 "${sel}"을 찾을 수 없음`); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `versions=${JSON.stringify(v)}\n`);
            console.log(`versions=${v.map(a => a.id).join(",")}`);
          '
        shell: bash

  # 2) 앱 버전마다 에뮬레이터를 띄워 스위트 실행 (버전이 늘어나면 병렬로 늘어난다)
  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.versions) }}
    name: ${{ needs.prepare.outputs.suite }} · ${{ matrix.app.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: APK 다운로드 및 검증 (${{ matrix.app.versionName }})
        env:
          APK_URL: ${{ matrix.app.apkUrl }}
          APK_SHA256: ${{ matrix.app.sha256 }}
        run: |
          curl -fsSL -o app.apk "$APK_URL"
          echo "$APK_SHA256  app.apk" | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 환경 실패 대응 (docs/troubleshooting.md 11번)
      #   부팅 직후 시스템 앱(런처 등)이 아직 무거운 상태에서 테스트를 시작하면
      #   "Pixel Launcher isn't responding" 같은 시스템 팝업이 앱 화면을 가려 assert가 실패한다.
      #   → ① 자원을 늘리고 ② 시스템이 안정될 때까지 기다리고 ③ 오류 팝업 자체를 끈다.
      - name: 에뮬레이터에서 ${{ needs.prepare.outputs.suite }} 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # [안정] 기본값(코어 2, RAM 2GB)은 부팅 직후 런처가 응답하지 못할 만큼 빠듯하다.
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          # [팝업] 맞춤법 검사 안내 등 입력 관련 시스템 UI가 뜨지 않게 한다.
          disable-spellchecker: true
          # [안정] 카메라 가상 장치는 쓰지 않으므로 꺼서 부팅 부하를 줄인다.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          # emulator-runner는 script를 한 줄씩 따로 실행하고, 한 줄이라도 실패하면 단계가 실패한다.
          script: |
            echo "== [안정 1] 부팅 완료 + 부팅 애니메이션 종료 대기 (최대 5분)"
            timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ] && [ "$(adb shell getprop init.svc.bootanim | tr -d "\r")" = "stopped" ]; do sleep 2; done'
            echo "== [안정 2] 패키지 매니저 응답 대기 (설치·실행 명령을 받을 수 있는 상태)"
            timeout 120 sh -c 'until adb shell pm path android >/dev/null 2>&1; do sleep 2; done'
            echo "== [팝업] 시스템 오류·응답 없음(ANR) 팝업 끄기"
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0
            echo "== [안정 3] 홈으로 이동 후 런처가 정상 응답(포커스)할 때까지 대기 (최대 2분)"
            adb shell input keyevent KEYCODE_HOME
            timeout 120 sh -c 'until adb shell dumpsys window | grep mCurrentFocus | grep -i launcher | grep -viq "not responding"; do sleep 3; adb shell input keyevent KEYCODE_HOME; done'
            echo "== [안정 4] 부팅 직후 백그라운드 작업이 가라앉도록 30초 대기"
            sleep 30
            echo "== [팝업] 이미 떠 있는 시스템 팝업이 있으면 닫기"
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            echo "== 테스트 직전 화면 포커스 (로그 확인용)"
            adb shell dumpsys window | grep mCurrentFocus
            adb install -r app.apk
            adb shell dumpsys package org.wikipedia | grep versionName
            npm run test:${{ needs.prepare.outputs.suite }}

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ needs.prepare.outputs.suite }}-${{ matrix.app.id }}
          path: |
            report/
            ~/.maestro/tests/
          if-no-files-found: warn
